# nginx — EUREKA frontend: serve the built SPA and reverse-proxy /api to the backend.
# Same-origin routing: the browser calls <frontend>/api/*, nginx forwards to the
# backend container (backend:8000). The backend is NOT exposed to the browser.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic cache for static assets (immutable hashed files)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
